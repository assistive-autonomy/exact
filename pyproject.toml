[project]
name = "exact"
version = "0.1.0"
description = "Learning and Reasoning with Executable Activity Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.27.0",
    "hydra-core>=1.3.0",
    "lark>=1.3.1",
    "mediapy>=1.2.4",
    "metamotivo[all]",
    "peft>=0.8.0",
    "pot>=0.9.5",
    "pydantic>=2.0.0",
    "transformers>=4.30.0",
    "wandb>=0.16.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ipywidgets>=8.1.8",
    "notebook>=7.4.7",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:__array_wrap__ must accept context and return_scalar arguments:DeprecationWarning:dm_control.utils.rewards",
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning:metamotivo.wrappers.humenvbench"
]


[tool.uv.sources]
metamotivo = { git = "https://github.com/facebookresearch/metamotivo.git" }

[tool.setuptools.package-dir]
exact = "exact"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
