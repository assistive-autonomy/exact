[project]
name = "executable-activity-models"
version = "0.1.0"
description = "Learning and Reasoning with Executable Activity Models"
authors = [
    {name = "rimvydasrub",email = "rimvydas.rubavicius@ed.ac.uk"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lightning (>=2.5.2,<3.0.0)"
]
[tool.poetry]
packages = [
    { include = "executable_activity_models"},
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
