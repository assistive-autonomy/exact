[project]
name = "exact"
version = "0.1.0"
description = "Learning and Reasoning with Executable Activity Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipywidgets>=8.1.7",
    "lightning>=2.5.2",
    "mediapy>=1.2.4",
    "metamotivo[all]",
    "notebook>=7.4.7",
    "pot>=0.9.5",
    "pyparsing>=3.2.3",
    "syncode>=0.4.16",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:__array_wrap__ must accept context and return_scalar arguments:DeprecationWarning:dm_control.utils.rewards",
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning:metamotivo.wrappers.humenvbench"
]


[tool.uv.sources]
metamotivo = { git = "https://github.com/facebookresearch/metamotivo.git" }

[tool.setuptools.package-dir]
exact = "exact"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

