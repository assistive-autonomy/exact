# Example: Custom experiment configuration
# Save as configs/experiment/my_experiment.yaml
# Usage: python scripts/train_sft.py +experiment=my_experiment

# @package _global_

# Override defaults for a specific experiment
defaults:
  - override /training: default
  - override /data: large

# Custom experiment name
wandb:
  name: qwen-large-dataset-experiment
  tags:
    - qwen-coder
    - large-dataset
    - experiment-v1

# Experiment-specific hyperparameters
training:
  learning_rate: 3.0e-6
  num_train_epochs: 20
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  ce_weight: 1.0
  ot_weight: 1.5
  structural_weight: 0.3
  
# Use a specific seed for this experiment
seed: 123
