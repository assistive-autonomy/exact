# Main configuration for GRPO training
defaults:
  - model: qwen-coder
  - training: default
  - data: default
  - _self_

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

# Experiment tracking
wandb:
  project: exact-grpo
  entity: null  # Set to your wandb username/team
  name: qwen-coder_${training.learning_rate}_${data.num_train_samples}
  tags:
    - grpo
    - inverse-model
    - qwen-coder
  mode: online  # online, offline, or disabled
  dir: ${hydra:run.dir}

# Device configuration
device: null  # null for auto-detect, or specify "cuda" or "cpu"

# Behavior model configuration
behavior_model:
  name: facebook/metamotivo-M-1
  batch_size: 256
  max_episode_steps: 1000

# Output directory
output_dir: ${hydra:run.dir}/checkpoints

# Random seed for reproducibility
seed: 42
