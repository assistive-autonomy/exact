seed: 42
device: auto

# Data (relative to project root)
train_data: ../exact_data/train_diverse.h5
eval_data: ../exact_data/eval.h5

# Output
output_dir: results/parser

# ========== MODEL ==========
model_name: /pvc/Qwen/Qwen2.5-Coder-3B
max_seq_length: 512
load_in_4bit: false

# Generation / evaluation settings
generation_max_new_tokens: 512
generation_retries: 3
generation_retry_temperature: 0.6    # [CHANGED] 0.5→0.6: more diversity on retry
generation_retry_top_p: 0.9
generation_temperature: 0.1          # [CHANGED] 0.3→0.1: near-greedy for more deterministic output
use_constrained_decoding: true
log_generation_attempts: false
skip_post_training_eval: false
max_frame: 1024

# ========== ST-GCN ENCODER ==========
motion_dim: 72  # 24 joints * 3 (x, y, z)
graph_strategy: spatial

stgcn_hidden_channels: 256
stgcn_num_blocks: 8
stgcn_num_temporal_tokens: 16
stgcn_temporal_kernel: 7
stgcn_spatial_kernel: 3
stgcn_dropout: 0.15                   # [CHANGED] 0.25→0.15: less dropout for stronger encoder features
stgcn_joint_embedding: true

# ========== AUXILIARY LOSSES ==========
# InfoNCE contrastive alignment — CRITICAL for motion-text correspondence
alignment_weight: 0.5                 # [CHANGED] 0.23→0.5: stronger contrastive signal
alignment_dim: 512
alignment_temperature: 0.1            # [CHANGED] 0.19→0.1: sharper contrastive loss gradients

# ========== LORA CONFIG ==========
lora_r: 16                            # [CHANGED] 8→16: more capacity for adaptation
lora_alpha: 32                        # [CHANGED] 16→32: maintain alpha/r=2 ratio
lora_dropout: 0.05

# ========== TRAINING HYPERPARAMETERS ==========
num_train_epochs: 40                  # [CHANGED] 25→40: longer training with lower LR
per_device_train_batch_size: 64
per_device_eval_batch_size: 64
learning_rate: 5e-5                   # [CHANGED] 1e-4→5e-5: lower base LR for stability
encoder_lr: 1e-4                      # [CHANGED] 1.6e-6→1e-4: MUCH higher encoder LR
scale_lr: 1e-4
weight_decay: 0.01                    # [CHANGED] 0.0075→0.01: slightly more regularization
max_grad_norm: 1.0
warmup_ratio: 0.1                     # [CHANGED] 0.17→0.1: shorter warmup with lower LR
lr_scheduler_type: cosine
gradient_accumulation_steps: 1
dataloader_num_workers: 16
dataloader_persistent_workers: true
logging_steps: 100
bf16: true
tf32: true
dataloader_prefetch_factor: 4
gradient_checkpointing: true
eval_strategy: steps
eval_steps: 1000                      # [CHANGED] 2000→1000: more frequent eval
max_eval_samples_training: 100

# Checkpointing
save_strategy: steps
save_steps: 1000                      # [CHANGED] 2000→1000: more frequent saves
save_total_limit: 5                   # [CHANGED] 3→5: keep more checkpoints
load_best_model_at_end: true
metric_for_best_model: eval_loss

# Early stopping
early_stopping_patience: 7            # [CHANGED] 5→7: more patience with longer training

# Sweep-specific
sweep_train_fraction: 0.1
sweep_max_epochs: 10

# Mid-training generation evaluation
generation_eval_steps: 2000           # [CHANGED] 4000→2000: earlier generation feedback
generation_eval_samples: 16

# Final evaluation
eval_samples: 8

# Wandb
report_to: wandb
wandb_project: exact
wandb_entity: assistive-autonomy
wandb_mode: online
