seed: 42
device: auto

# Data (relative to project root)
train_data: ../exact_data/train_diverse.h5
eval_data: ../exact_data/eval.h5

# Output
output_dir: results/parser

# ========== MODEL ==========
model_name: /pvc/Qwen/Qwen2.5-Coder-3B
max_seq_length: 512
load_in_4bit: false

# Generation / evaluation settings
generation_max_new_tokens: 512
generation_retries: 5                  # [v3] 3→5: more retries for recovering diverse multi-segment programs
generation_retry_temperature: 0.7      # [v3] 0.6→0.7: higher retry temperature for exploration
generation_retry_top_p: 0.92           # [v3] 0.9→0.92: slightly wider nucleus
generation_temperature: 0.4            # [v3] 0.1→0.4: near-greedy was causing mode collapse into single-segment programs
use_constrained_decoding: true
log_generation_attempts: false
skip_post_training_eval: false
max_frame: 1024

# ========== ST-GCN ENCODER ==========
# Architecture unchanged (per user request)
motion_dim: 72  # 24 joints * 3 (x, y, z)
graph_strategy: spatial

stgcn_hidden_channels: 256
stgcn_num_blocks: 8
stgcn_num_temporal_tokens: 16
stgcn_temporal_kernel: 7
stgcn_spatial_kernel: 3
stgcn_dropout: 0.3                     # [v3] 0.15→0.3: critical for reducing encoder overfitting (v1 was 0.25, still overfit)
stgcn_joint_embedding: true

# ========== VARIABLE-LENGTH CROP AUGMENTATION ==========
# During training, randomly crop a contiguous subset of program segments
# and the corresponding motion frames.  The cropped motion is zero-padded
# back to 1024 and the program frame numbers are renumbered from 0.
# This teaches the encoder to handle variable-length inputs (ESK verb
# segments are median 26 frames; HumanAct12 ~60 frames — vs 1024 in
# training data), eliminating the domain-gap mode collapse.
augment_crop_prob: 0.6                 # [v3.1] 0.5→0.6: aggressive augmentation to close the domain gap (ESK segments are ~26-60 frames)
augment_min_segments: 1                # Keep at least 1 segment when cropping
augment_min_crop_frames: 64            # [v3.1] 32→64: avoid degenerate crops where 97% is zero-padding

# ========== AUXILIARY LOSSES ==========
# InfoNCE contrastive alignment
# v2's 0.5 was too aggressive — it dominated the LM loss and caused the encoder
# to take shortcuts (focusing on ltoe/lankle). Lower weight lets the LM loss
# drive learning and the encoder learns richer motion representations.
alignment_weight: 0.15                 # [v3] 0.5→0.15: reduce contrastive dominance; LM loss is the primary objective
alignment_dim: 512
alignment_temperature: 0.07            # [v3] 0.1→0.07: standard CLIP temperature for sharper contrastive pairs

# ========== LORA CONFIG ==========
# v2's r=16 gave too much LoRA capacity for 50K training samples → overfitting.
# Best eval_loss occurred at epoch 20 while model ran to epoch 40.
lora_r: 8                             # [v3] 16→8: less LoRA capacity to combat overfitting (matches v1)
lora_alpha: 16                         # [v3] 32→16: maintain alpha/r = 2
lora_dropout: 0.1                      # [v3] 0.05→0.1: increase LoRA dropout for regularization

# ========== TRAINING HYPERPARAMETERS ==========
num_train_epochs: 25                   # [v3] 40→25: best model was at epoch ~20; extra epochs just overfit
per_device_train_batch_size: 64
per_device_eval_batch_size: 64
learning_rate: 8e-5                    # [v3] 5e-5→8e-5: slightly higher LoRA LR for faster adaptation
encoder_lr: 1e-5                       # [v3.1] 1e-4→5e-6→1e-5: v2's 1e-4 overfit, v3's 5e-6 too slow; 1e-5 balances learning vs stability for 13M param encoder
scale_lr: 1e-4
weight_decay: 0.05                     # [v3] 0.01→0.05: stronger L2 regularization against overfitting
max_grad_norm: 1.0
warmup_ratio: 0.15                     # [v3] 0.1→0.15: slightly longer warmup for stability with higher LoRA LR
lr_scheduler_type: cosine
gradient_accumulation_steps: 1
dataloader_num_workers: 16
dataloader_persistent_workers: true
logging_steps: 100
bf16: true
tf32: true
dataloader_prefetch_factor: 4
gradient_checkpointing: true
eval_strategy: steps
eval_steps: 500                        # [v3] 1000→500: more frequent eval for tighter early stopping
max_eval_samples_training: 100

# Checkpointing
save_strategy: steps
save_steps: 500                        # [v3] 1000→500: match eval frequency
save_total_limit: 5
load_best_model_at_end: true
metric_for_best_model: eval_loss

# Early stopping
early_stopping_patience: 5             # [v3] 7→5: tighter patience — overfitting is the main problem

# Sweep-specific
sweep_train_fraction: 0.1
sweep_max_epochs: 10

# Mid-training generation evaluation
generation_eval_steps: 1000            # [v3] 2000→1000: earlier and more frequent generation feedback
generation_eval_samples: 32            # [v3] 16→32: more samples for reliable generation metrics
gen_early_stopping_patience: 5         # [v3.1] Stop if generation edit distance doesn't improve for 5 consecutive gen evals

# Final evaluation
eval_samples: 16                       # [v3] 8→16: double eval samples for more reliable metrics

# Wandb
report_to: wandb
wandb_project: exact
wandb_entity: assistive-autonomy
wandb_mode: online
