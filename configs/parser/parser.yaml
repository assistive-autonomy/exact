seed: 42
device: auto

# Data (relative to project root)
train_data: ../exact_data/train_diverse.h5
eval_data: ../exact_data/eval.h5

# Output
output_dir: results/parser

# ========== MODEL ==========
# Qwen2.5-Coder-3B: hidden_size=2048, 36 layers
# 3B is sufficient — the bottleneck is the encoder, not the decoder.
# 7B showed identical edit distance (0.57) with 2x slower training.
model_name: /pvc/Qwen/Qwen2.5-Coder-3B
max_seq_length: 512
load_in_4bit: false

# Generation / evaluation settings
generation_max_new_tokens: 512
generation_retries: 3
generation_retry_temperature: 0.5
generation_retry_top_p: 0.9
generation_temperature: 0.3
use_constrained_decoding: true
log_generation_attempts: false
skip_post_training_eval: false
max_frame: 1024

# ========== ST-GCN ENCODER ==========
# Motion encoder using Spatial-Temporal Graph Convolutional Networks
# output_dim = 2048 = matches Qwen-3B hidden_size
motion_dim: 72  # 24 joints * 3 (x, y, z)
graph_strategy: spatial

stgcn_hidden_channels: 256  # 64→128: 2x channels preserves per-joint identity through graph mixing
stgcn_num_blocks: 8          # 4→6: deeper = richer spatio-temporal features
stgcn_num_temporal_tokens: 16  # Reduced: 48 was excessive; 16 tokens = 64 frames/token
stgcn_temporal_kernel: 7
stgcn_spatial_kernel: 3
stgcn_dropout: 0.25
stgcn_joint_embedding: true  # Learnable per-joint positional encoding (24 × hidden_channels)

# ========== CONDITIONING ==========
# Motion tokens are projected and prepended as prefix to text embeddings.
# The LLM's native self-attention handles motion-to-text conditioning.

# ========== AUXILIARY LOSSES ==========
# InfoNCE: contrastive loss aligns motion encoder with LLM program embeddings.
# Joint BCE: per-temporal-token classification of which joints are active.
# Total loss = LM_loss + alignment_weight * InfoNCE + joint_loss_weight * BCE
alignment_weight: 0.23
alignment_dim: 512
alignment_temperature: 0.19

# ========== JOINT-ACTIVITY AUXILIARY LOSS ==========
# Per-temporal-token binary classification: which of 24 joints are active?
# Directly supervises the encoder to preserve per-joint identity.
# Reduced from 0.5: at 0.5 the joint gradient (0.5*0.38=0.19) competed with
# the LM loss and dominated encoder updates.  At 0.17 the joint signal is
# still meaningful but the encoder is primarily driven by the LM objective.
joint_loss_weight: 0.17

# ========== LORA CONFIG ==========
# Reduced rank (16 vs 32) — 3B model needs less adaptation capacity
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

# ========== TRAINING HYPERPARAMETERS ==========
num_train_epochs: 25
per_device_train_batch_size: 16     # 3B model fits larger batch
per_device_eval_batch_size: 16
learning_rate: 0.0001                   # Base LR (used for LoRA + projection)
encoder_lr: 1.6e-06                     # Lower to prevent encoder from dominating early
scale_lr: 1e-4                       # Faster adaptation for motion_scale
weight_decay: 0.0075
max_grad_norm: 1.0
warmup_ratio: 0.17                   # Longer warmup for stable early training
lr_scheduler_type: cosine
gradient_accumulation_steps: 2       # Effective batch = 32
dataloader_num_workers: 8
logging_steps: 100
bf16: true
dataloader_prefetch_factor: 4
gradient_checkpointing: true
eval_strategy: steps
eval_steps: 2000
max_eval_samples_training: 100

# Checkpointing
save_strategy: steps
save_steps: 2000
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss

# Early stopping
early_stopping_patience: 5

# Sweep-specific: fraction of training data to use (0.1 = 10%)
# Only used by sweep_parser.py — train_parser.py always uses full data.
sweep_train_fraction: 0.1
sweep_max_epochs: 10

# Mid-training generation evaluation
# Run generation-based eval every N steps to catch issues like
# high eval_loss but 0% generation accuracy early.
generation_eval_steps: 4000
generation_eval_samples: 16

# Final evaluation (generation with constrained decoding)
eval_samples: 64

# Wandb
report_to: wandb
wandb_project: exact
wandb_entity: assistive-autonomy
wandb_mode: online
