# Default training configuration for SFT
num_train_epochs: 10
per_device_train_batch_size: 2  # Reduced for larger model
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8  # Increased to maintain effective batch size
learning_rate: 5.0e-6
max_grad_norm: 1.0
warmup_steps: 100

# Loss weights
ce_weight: 1.0        # Cross-entropy loss for token prediction
ot_weight: 1.0        # Optimal transport loss for motion reconstruction

# Logging
logging_steps: 10
eval_steps: null  # null means evaluate at end of each epoch
save_strategy: epoch
evaluation_strategy: epoch
save_total_limit: 3

# Mixed precision training
fp16: true  # Set to false if you don't have CUDA
