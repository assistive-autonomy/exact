# Fast training configuration for debugging
num_train_epochs: 2
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
max_grad_norm: 1.0
warmup_steps: 10

# Loss weights
ce_weight: 1.0
ot_weight: 0.5  # Reduced for faster training

# Logging
logging_steps: 1
eval_steps: 10
save_strategy: steps
evaluation_strategy: steps
save_total_limit: 2

# Mixed precision training
fp16: true
