# method: mean_sigmoid  or  min_sigmoid  (override via CLI: method=min_sigmoid)
method: mean_sigmoid

experiment:
  name: null
  seed: 42

data:
  esk_dir: ../exact_data/benchmarks/esk
  label_type: activity
  target_activities:
    - experimental procedure
    - getting ready
    - cleaning
    - cooking
    - preparing ingredients
  # Paths auto-detected from esk_dir and label_type when not set:
  models_path: null          # path to models_activity.json
  test_programs_path: null   # path to programs_activity_test.json
  train_budget: 100          # programs per activity (used only if models_path is absent)
  exec_num_workers: 1        # parallel workers for edit-distance computation

output:
  dir: results/anomaly_detection

wandb_project: exact
wandb_entity: assistive-autonomy
wandb_mode: online
