training:
  seed: 42
  model:
    name: microsoft/phi-2
    tokenizer: microsoft/phi-2
  lora:
    r: 8
    alpha: 16           
    dropout: 0.05      
  motion_encoder:
    motion_dim: 69      # local_body_pos: 23 bodies * 3 axes
    hidden_dim: 256
    num_layers: 6
    num_prefix_tokens: 8
  motion_model:
    name: facebook/metamotivo-M-1
    batch_size: 256
  train_data_path: data/humenv/train.hdf5
  eval_data_path: data/humenv/eval.hdf5
  num_train_epochs: 10
  num_workers: 4
  max_seq_length: 512
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 100
  save_every: 5
wandb:
  project: exact
  entity: assistive-autonomy
  name: parser-training
  mode: disabled