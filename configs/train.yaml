training:
  model: Qwen/Qwen2.5-Coder-3B-Instruct
  tokenizer: Qwen/Qwen2.5-Coder-3B-Instruct
  lora_r: 8                     # LoRA rank (higher = more parameters, better performance)
  lora_alpha: 16           # LoRA scaling factor (typically 2*r)
  lora_dropout: 0.05       # Dropout for LoRA layers
  motion_encoder:
    motion_dim: 256
    hidden_dim: 1024
    num_layers: 6
    num_prefix_tokens: 8
  behaviour_model:
    name: facebook/metamotivo-M-1
    batch_size: 256
    max_episode_steps: 1000
  num_train_epochs: 10
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  max_grad_norm: 1.0
  warmup_steps: 100
  
  # Loss weights
  ce_weight: 1.0        # Cross-entropy loss for token prediction
  ot_weight: 1.0        # Optimal transport loss for motion reconstruction
  
  # Logging and checkpointing
  logging_steps: 10
  eval_steps: null      # null means evaluate at end of each epoch
  save_strategy: epoch
  evaluation_strategy: epoch
  save_total_limit: 3


# Data configuration
data:
  num_train_samples: 1000
  num_val_samples: 200
  num_steps: 100
  max_program_length: 128  # Maximum length for tokenized programs
  
  # Program generation parameters
  program_generation:
    min_units: 1
    max_units: 5
    min_value: 0.1
    max_value: 1.0

# Experiment tracking
wandb:
  project: exact-grpo
  entity: null
  name: qwen-coder_${training.learning_rate}_${data.num_train_samples}
  tags:
    - grpo
    - inverse-model
    - qwen-coder
  mode: disabled
  dir: ${hydra:run.dir}

# Device configuration
device: null  # null for auto-detect, or specify "cuda" or "cpu"

# Behavior model configuration
behavior_model:
  name: facebook/metamotivo-M-1
  batch_size: 256
  max_episode_steps: 1000

# Output directory
output_dir: ${hydra:run.dir}/checkpoints

# Random seed for reproducibility
seed: 42

