program: scripts/train_parser.py
method: bayes
metric:
  name: eval/loss
  goal: minimize

parameters:
  # Learning rate - most impactful hyperparameter
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-4

  # LoRA configuration
  lora_r:
    values: [4, 8, 16, 32]
  lora_alpha:
    values: [8, 16, 32, 64]
  lora_dropout:
    distribution: uniform
    min: 0.0
    max: 0.2

  # Motion encoder architecture
  motion_hidden_dim:
    values: [64, 128, 256, 512]
  motion_num_layers:
    values: [2, 4, 6, 8]
  num_prefix_tokens:
    values: [4, 8, 16, 32]

  # Training dynamics
  weight_decay:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1
  warmup_steps:
    values: [50, 100, 200, 500]
  gradient_accumulation_steps:
    values: [2, 4, 8, 16, 32, 64]
  per_device_train_batch_size:
    values: [1, 2, 4, 8, 16, 32]

command:
  - ${env}
  - uv
  - run
  - ${program}
  - ${args_no_hyphens}