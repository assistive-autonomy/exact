# Wandb Sweep: Activity Assessment (STG-NF)
# Optimizes hyperparameters across all target_activities defined in config
# The sweep trains N models (one per activity) and reports mean AUC
# NOTE: Each trial trains 10 models, so sweeps are computationally expensive

program: scripts/assessment.py
method: bayes
metric:
  name: mean_auc
  goal: maximize

# Limit number of trials (each trains 10 models)
run_cap: 50

parameters:
  # Model architecture
  model.hidden_channels:
    values: [32, 64, 128]
  model.K:
    values: [4, 8, 16]
  model.L:
    values: [1, 2, 3]
  model.temporal_kernel:
    values: [5, 9, 13]
  model.R:
    values: [1.0, 3.0, 6.0]
  model.adj_strategy:
    values: [uniform, distance, learn]

  # Data configuration
  data.seg_len:
    values: [12, 24, 48]
  data.seg_stride:
    values: [3, 6, 12]

  # Training
  training.lr:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-3
  training.lr_decay:
    distribution: uniform
    min: 0.9
    max: 0.99
  training.epochs:
    values: [10, 20, 30]
  training.batch_size:
    values: [32, 64, 128]
  training.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-4

command:
  - ${env}
  - uv
  - run
  - ${program}
  - ${args_no_hyphens}
