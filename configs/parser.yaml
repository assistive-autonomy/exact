seed: 42
device: auto

# Data (relative to project root)
train_data: ../exact_data/train.h5
eval_data: ../exact_data/eval.h5

# Output
output_dir: results/parser

# Model - Use BASE model (not Instruct) for better fine-tuning
model_name: /public/hf/models/meta-llama/Llama-3.2-3B
max_seq_length: 1024
load_in_4bit: false  # Set true for larger models if you want a 4-bit base

# Generation / evaluation settings
generation_max_new_tokens: 256
generation_retries: 2
generation_retry_temperature: 0.8
generation_retry_top_p: 0.9
log_generation_attempts: false

# ========== ST-GCN ENCODER CONFIG ==========
# Motion encoder architecture using Spatial-Temporal Graph Convolutional Networks
# Leverages SMPL 24-joint skeletal structure for superior motion representation
motion_dim: 72  # 24 joints * 3 (x, y, z)
graph_strategy: spatial  # Adjacency partitioning: uniform, distance, or spatial

# ST-GCN architecture
stgcn_hidden_channels: 64  # Hidden channels for ST-GCN blocks
stgcn_num_blocks: 4  # Number of ST-GCN blocks
stgcn_temporal_kernel: 9  # Temporal convolution kernel size
stgcn_spatial_kernel: 3  # Spatial graph convolution partitions
stgcn_dropout: 0.1  # Dropout for regularization

# ========== LORA CONFIG ==========
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05

# ========== TRAINING HYPERPARAMETERS ==========
num_train_epochs: 15
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
learning_rate: 5e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_ratio: 0.03
lr_scheduler_type: cosine
gradient_accumulation_steps: 4
dataloader_num_workers: 4
logging_steps: 10
bf16: true
dataloader_prefetch_factor: 2
gradient_checkpointing: false
eval_strategy: steps
eval_steps: 500

# Checkpointing
save_strategy: steps
save_steps: 500
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss

# Early stopping
early_stopping_patience: 5

# Evaluation
eval_samples: 16

# Wandb
report_to: wandb
wandb_project: exact
wandb_entity: assistive-autonomy
wandb_mode: online