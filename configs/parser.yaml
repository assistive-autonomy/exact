seed: 42
device: auto

# Data
train_data: data/train.h5
eval_data: data/eval.h5

# Output
output_dir: results/parser

# Model
model_name: /public/hf/models/meta-llama/Llama-3.2-3B-Instruct
max_seq_length: 1024

# Motion encoder
motion_dim: 72  # 24 joints * 3 (x, y, z)
motion_hidden_dim: 72
motion_num_layers: 5
num_prefix_tokens: 24

# LoRA
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

# Training (HuggingFace TrainingArguments)
num_train_epochs: 10
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
learning_rate: 5.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
gradient_accumulation_steps: 4
dataloader_num_workers: 4
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss

# Evaluation
eval_samples: 8  # Number of samples for post-training evaluation

# Wandb
report_to: wandb
wandb_project: exact
wandb_entity: assistive-autonomy
wandb_mode: online
