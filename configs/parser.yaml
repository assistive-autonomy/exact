seed: 42
device: auto

# Data (relative to project root)
train_data: ../exact_data/train_small.h5
eval_data: ../exact_data/eval_small.h5

# Output
output_dir: results/parser

# Model
model_name: /public/hf/models/meta-llama/Llama-3.2-3B-Instruct
max_seq_length: 1024

# Motion encoder
motion_dim: 72  # 24 joints * 3 (x, y, z)
motion_hidden_dim: 72
motion_num_layers: 5
num_prefix_tokens: 24

# LoRA
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

# Training (HuggingFace TrainingArguments)
num_train_epochs: 10
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
learning_rate: 2e-4
weight_decay: 0.01
max_grad_norm: 1.0
warmup_ratio: 0.1
gradient_accumulation_steps: 4
dataloader_num_workers: 4
logging_steps: 10
bf16: true  # A100 has native bf16 support
dataloader_prefetch_factor: 2
gradient_checkpointing: false
eval_strategy: epoch

# Training checkpointing
save_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss

# Evaluation
eval_samples: 8  # Number of samples for post-training evaluation

# Wandb
report_to: wandb
wandb_project: exact
wandb_entity: assistive-autonomy
wandb_mode: online
