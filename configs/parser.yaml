seed: 42
device: auto

# Data (relative to project root)
train_data: ../exact_data/train_diverse.h5
eval_data: ../exact_data/eval.h5

# Output
output_dir: results/parser

# ========== MODEL ==========
# Qwen2.5-Coder-3B: hidden_size=2048, 36 layers
# Smaller model = faster iteration, matches ST-GCN output dim exactly
model_name: /pvc/Qwen/Qwen2.5-Coder-3B
max_seq_length: 512
load_in_4bit: false

# Generation / evaluation settings
generation_max_new_tokens: 512
generation_retries: 3
generation_retry_temperature: 0.5
generation_retry_top_p: 0.9
generation_temperature: 0.3
use_constrained_decoding: true
log_generation_attempts: false
max_frame: 1024

# ========== ST-GCN ENCODER ==========
# Motion encoder using Spatial-Temporal Graph Convolutional Networks
# output_dim = 2048 = matches Qwen-3B hidden_size (no projection needed!)
motion_dim: 72  # 24 joints * 3 (x, y, z)
graph_strategy: spatial

stgcn_hidden_channels: 64
stgcn_num_blocks: 4
stgcn_num_temporal_tokens: 64  # Fine-grained temporal resolution
stgcn_temporal_kernel: 9
stgcn_spatial_kernel: 3
stgcn_dropout: 0.1

# ========== PREFIX CONDITIONING ==========
# Cross-attention layers inject motion info at every Nth decoder layer.
# For Qwen2.5-3B (36 layers), every_n=4 gives 9 cross-attn layers.
# Gated cross-attention (gate init=0) ensures stable training start.
cross_attn_every_n: 4
cross_attn_num_heads: 8
cross_attn_dropout: 0.1

# ========== INFONCE ALIGNMENT ==========
# Contrastive loss aligns motion encoder latent space with LLM program
# embeddings. Matching (motion, program) pairs are pulled together.
# Total loss = LM_loss + alignment_weight * InfoNCE_loss
alignment_weight: 0.1
alignment_dim: 256
alignment_temperature: 0.07

# ========== LORA CONFIG ==========
# Reduced rank (16 vs 32) — 3B model needs less adaptation capacity
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

# ========== TRAINING HYPERPARAMETERS ==========
num_train_epochs: 25
per_device_train_batch_size: 16     # 3B model fits larger batch
per_device_eval_batch_size: 16
learning_rate: 3e-5                  # Slightly higher LR for smaller model
weight_decay: 0.01
max_grad_norm: 1.0
warmup_ratio: 0.1
lr_scheduler_type: cosine
gradient_accumulation_steps: 2       # Effective batch = 32
dataloader_num_workers: 8
logging_steps: 100
bf16: true
dataloader_prefetch_factor: 4
gradient_checkpointing: true
eval_strategy: steps
eval_steps: 2000
max_eval_samples_training: 100

# Checkpointing
save_strategy: steps
save_steps: 2000
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss

# Early stopping
early_stopping_patience: 5

# Final evaluation (generation with constrained decoding)
eval_samples: 64

# Wandb
report_to: wandb
wandb_project: exact
wandb_entity: assistive-autonomy
wandb_mode: online
