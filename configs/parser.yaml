seed: 42
device: auto

# Data (relative to project root)
train_data: ../exact_data/train.h5
eval_data: ../exact_data/eval.h5

# Output
output_dir: results/parser

# Model - Use BASE model (not Instruct) for better fine-tuning
model_name: /pvc/deepseek-coder-6.7b-base
max_seq_length: 1024
load_in_4bit: false  # Set true for larger models if you want a 4-bit base

# Generation / evaluation settings
generation_max_new_tokens: 512  # Increased to avoid truncation of longer programs
generation_retries: 3  # Extra retry for unconstrained fallback
generation_retry_temperature: 0.8
generation_retry_top_p: 0.9
use_constrained_decoding: true  # Enable Syncode grammar-constrained decoding
log_generation_attempts: false

# ========== ST-GCN ENCODER CONFIG ==========
# Motion encoder architecture using Spatial-Temporal Graph Convolutional Networks
# Leverages SMPL 24-joint skeletal structure for superior motion representation
motion_dim: 72  # 24 joints * 3 (x, y, z)
graph_strategy: spatial  # Adjacency partitioning: uniform, distance, or spatial

# ST-GCN architecture
stgcn_hidden_channels: 64  # Hidden channels for ST-GCN blocks
stgcn_num_blocks: 4  # Number of ST-GCN blocks
stgcn_num_temporal_tokens: 8  # Number of temporal tokens (preserves time structure)
stgcn_temporal_kernel: 9  # Temporal convolution kernel size
stgcn_spatial_kernel: 3  # Spatial graph convolution partitions
stgcn_dropout: 0.1  # Dropout for regularization

# ========== CROSS-MODAL ATTENTION & ALIGNMENT ==========
# Forces decoder to ground predictions in motion sequence via explicit attention
use_cross_attention: true  # Enable cross-attention from decoder to motion encoder
cross_attention_heads: 8  # Number of attention heads

# Latent space alignment: MSE loss between motion embedding and program embedding
use_alignment_loss: true  # Enable contrastive/alignment loss
alignment_weight: 0.1  # Weight for alignment loss (0.1 = 10% of total loss)
alignment_latent_dim: 256  # Dimension of shared latent space

# ========== LORA CONFIG ==========
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05

# ========== TRAINING HYPERPARAMETERS ==========
num_train_epochs: 15
per_device_train_batch_size: 8  # Increased for efficiency
per_device_eval_batch_size: 16  # Larger for faster eval
learning_rate: 5e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_ratio: 0.03
lr_scheduler_type: cosine
gradient_accumulation_steps: 2  # Reduced to maintain effective batch size
dataloader_num_workers: 4
logging_steps: 50  # Less frequent logging
bf16: true
dataloader_prefetch_factor: 2
gradient_checkpointing: true  # Enable to reduce memory, allows larger batches
eval_strategy: steps
eval_steps: 1000  # Less frequent eval during training
max_eval_samples_training: 200  # Subsample eval dataset during training for speed

# Checkpointing
save_strategy: steps
save_steps: 1000  # Match eval_steps
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss

# Early stopping
early_stopping_patience: 5

# Final evaluation (generation with constrained decoding)
eval_samples: 32  # Number of samples for final generation evaluation

# Wandb
report_to: wandb
wandb_project: exact
wandb_entity: assistive-autonomy
wandb_mode: online